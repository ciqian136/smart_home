    </symbol>
    <symbol id="sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.2" fill="none" stroke="#e2a93b" stroke-width="1.7"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke="#e2a93b" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="smoke" viewBox="0 0 24 24">
      <path d="M7 19c-2.4-1.5-2.5-3.4-.4-4.9 2.2-1.5 2.1-3.5-.1-5M13 20c-2.5-1.6-2.6-3.8-.4-5.3 2.3-1.5 2.1-3.8-.1-5.4M18 18c-1.8-1.3-1.8-2.9-.2-4.1 1.7-1.2 1.6-2.8-.1-4" fill="none" stroke="#8b6dca" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M3 21h18" stroke="#8b6dca" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
