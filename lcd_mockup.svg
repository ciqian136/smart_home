    <text x="208" y="20" fill="#7ce0b2" font-size="10" font-family="Microsoft YaHei, Arial">AUTO</text>
    <use href="#wifi" x="263" y="9" width="16" height="14"/>
    <text x="284" y="20" fill="#7ce0b2" font-size="10" font-family="Microsoft YaHei, Arial">在线</text>

    <rect class="tile" x="8" y="38" width="96" height="54" rx="3"/>
    <use href="#thermo" x="15" y="47" width="18" height="18"/>
