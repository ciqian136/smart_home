    <text class="value" x="246" y="82">328</text><text class="unit" x="287" y="81">lux</text>

    <rect class="tile" x="8" y="100" width="96" height="54" rx="3"/>
    <use href="#dust" x="16" y="109" width="18" height="18"/>
    <text class="label" x="40" y="116">PM2.5</text>
    <text class="value" x="38" y="144">18.4</text><text class="unit" x="80" y="143">ug</text>

    <rect class="tile" x="112" y="100" width="96" height="54" rx="3"/>
    <use href="#smoke" x="119" y="109" width="18" height="18"/>
