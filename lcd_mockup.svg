    <rect class="tile" x="92" y="72" width="220" height="102" rx="3"/>
    <text class="label" x="103" y="88">R</text><rect x="120" y="80" width="126" height="9" fill="#f1d9dc" rx="4"/><rect x="120" y="80" width="118" height="9" fill="#e35d6a" rx="4"/><text class="value" x="263" y="91" font-size="16">255</text>
    <text class="label" x="103" y="119">G</text><rect x="120" y="111" width="126" height="9" fill="#d9eee6" rx="4"/><rect x="120" y="111" width="84" height="9" fill="#31ad79" rx="4"/><text class="value" x="263" y="122" font-size="16">180</text>
    <text class="label" x="103" y="150">B</text><rect x="120" y="142" width="126" height="9" fill="#d9e6f2" rx="4"/><rect x="120" y="142" width="28" height="9" fill="#3194d0" rx="4"/><text class="value" x="263" y="153" font-size="16">60</text>

    <rect class="button" x="8" y="182" width="72" height="21" rx="3"/><rect class="button" x="86" y="182" width="72" height="21" rx="3"/><rect class="button" x="164" y="182" width="72" height="21" rx="3"/><rect class="button" x="242" y="182" width="70" height="21" rx="3"/>
    <text class="buttonText" x="31" y="196">白光</text><text class="buttonText" x="111" y="196">暖光</text><text class="buttonText" x="190" y="196">夜灯</text><text class="buttonText" x="263" y="196">关闭</text>
    <rect class="nav" x="8" y="210" width="98" height="21" rx="3"/><rect class="selected" x="112" y="210" width="98" height="21" rx="3"/><rect class="nav" x="216" y="210" width="96" height="21" rx="3"/>
    <text class="buttonText" x="46" y="224">环境</text><text class="selectedText" x="150" y="224">灯光</text><text class="buttonText" x="253" y="224">风扇</text>
  </g>

  <!-- page2 -->
  <g transform="translate(690 8)">
