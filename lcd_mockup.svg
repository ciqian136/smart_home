<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="330" viewBox="0 0 1020 330">
  <defs>
    <style>
      .screen { fill: #f4f6f7; stroke: #111820; stroke-width: 6; }
      .header { fill: #202a33; }
      .nav { fill: #ffffff; stroke: #c8d0d5; stroke-width: 1; }
      .tile { fill: #ffffff; stroke: #d5dde1; stroke-width: 1; }
      .title { fill: #ffffff; font: 600 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .label { fill: #53616b; font: 11px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .small { fill: #53616b; font: 9px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .value { fill: #1d2a33; font: 700 22px "Segoe UI", Arial, sans-serif; }
      .unit { fill: #53616b; font: 9px "Segoe UI", Arial, sans-serif; }
      .button { fill: #ffffff; stroke: #bfc9ce; stroke-width: 1; }
      .buttonText { fill: #34444d; font: 10px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .selected { fill: #0f9d8a; stroke: #0f9d8a; }
      .selectedText { fill: #ffffff; font: 600 10px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .line { stroke: #dbe2e5; stroke-width: 1; }
      .muted { fill: #87949c; font: 9px "Segoe UI", Arial, sans-serif; }
      .ok { fill: #2c9b77; }
      .warn { fill: #d6762d; }
    </style>
    <symbol id="wifi" viewBox="0 0 20 16">
      <path d="M1 5.5C6.5 0.8 13.5 0.8 19 5.5M4.5 9C8 6.1 12 6.1 15.5 9M8.2 12.2C10.2 10.7 11.8 10.7 13.8 12.2" fill="none" stroke="#7ce0b2" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="11" cy="14.1" r="1.1" fill="#7ce0b2"/>
    </symbol>
    <symbol id="thermo" viewBox="0 0 24 24">
      <path d="M13 14.8V5.2a3 3 0 0 0-6 0v9.6a5.3 5.3 0 1 0 6 0Z" fill="none" stroke="#e35d6a" stroke-width="1.8"/>
      <path d="M10 8v8.5" stroke="#e35d6a" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="10" cy="18.2" r="2.6" fill="#e35d6a"/>
    </symbol>
    <symbol id="drop" viewBox="0 0 24 24">
