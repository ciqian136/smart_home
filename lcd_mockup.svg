    <text x="226" y="143" fill="#2c9b77" font-size="20" font-weight="700" font-family="Microsoft YaHei, Arial">正常</text>

    <rect class="tile" x="8" y="163" width="304" height="32" rx="3"/>
    <use href="#bulb" x="18" y="171" width="14" height="14"/>
