    <use href="#fan" x="94" y="171" width="14" height="14"/>
    <text class="small" x="113" y="182">风扇 450</text>
    <use href="#face" x="177" y="171" width="14" height="14"/>
    <text class="small" x="196" y="182">已识别</text>
    <circle cx="270" cy="178" r="4" fill="#31ad79"/><text class="small" x="279" y="182">在线</text>

    <rect x="8" y="204" width="98" height="27" class="selected" rx="3"/>
    <rect x="112" y="204" width="98" height="27" class="nav" rx="3"/>
    <rect x="216" y="204" width="96" height="27" class="nav" rx="3"/>
    <text class="selectedText" x="46" y="221">环境</text>
    <text class="buttonText" x="145" y="221">灯光</text>
    <text class="buttonText" x="253" y="221">风扇</text>
  </g>

